name: Pull request CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate autoscaling plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
